name: MicroPython Tests (HIL)

on:
  workflow_dispatch:
    inputs:
      board_name:
        description: Board pinout name to deploy before running tests (see upython/backend/config_files/pinout_<name>.json)
        required: true
        default: esp32_wroom_v1

jobs:
  run-on-esp32:
    # Requires a self-hosted runner with labels: self-hosted, esp32
    runs-on: [self-hosted, esp32]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create virtualenv
        run: python3 -m venv "${{ github.workspace }}/.venv"

      - name: Install dependencies (including mpremote)
        run: |
          source "${{ github.workspace }}/.venv/bin/activate"
          pip install --upgrade pip
          pip install -r upython/requirements-build.txt
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify mpremote is available
        run: mpremote --help >/dev/null

      - name: Deploy app code to device
        working-directory: upython
        run: ./scripts/deploy-dev --no-reset "${{ inputs.board_name }}"

      - name: Run MicroPython backend tests on device
        run: ./upython/scripts/test-backend-mpy
