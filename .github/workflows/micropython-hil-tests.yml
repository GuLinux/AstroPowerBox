name: MicroPython Tests (HIL)

on:
  push:
    branches:
      - main
    paths:
      - backend/**
  workflow_dispatch:
    inputs:
      board_name:
        description: Board pinout name to deploy before running tests (see backend/config_files/pinout_<name>.json)
        required: true
        default: esp32_wroom_v1

concurrency:
  # Keep only the newest waiting HIL run when the self-hosted runner is offline.
  group: micropython-hil-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-on-esp32:
    # Requires a self-hosted runner with labels: self-hosted, esp32
    runs-on: [self-hosted, esp32]
    # This limit begins after the runner accepts the job, not while it is queued.
    timeout-minutes: 20
    env:
      BOARD_NAME: ${{ inputs.board_name || 'esp32_wroom_v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create virtualenv
        run: python3 -m venv "${{ github.workspace }}/.venv"

      - name: Install dependencies (including mpremote)
        run: |
          source "${{ github.workspace }}/.venv/bin/activate"
          pip install --upgrade pip
          pip install -r requirements-build.txt
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify mpremote is available
        run: mpremote --help >/dev/null

      - name: Deploy app code to device
        run: ./scripts/deploy-dev --no-reset "$BOARD_NAME"

      - name: Run MicroPython backend tests on device
        run: ./scripts/test-backend-mpy
